[graph]
# Published crates do not include [dev-dependencies] (examples, tests, benches).
exclude-dev = true

[advisories]
version = 2
unmaintained = "all"
ignore = [
    # ctutils < 0.4.4: non-constant-time mask generation (timing side channel).
    # Pulled in by aes-gcm/universal-hash/digest for the optional `akamai-keylog`
    # feature only. The patched release needs Rust 1.87 (MSRV is 1.85).
    # Not exploitable here: huginn decrypts traffic already captured, with keys
    # the operator supplies; no attacker can time operations on those secrets.
    # Remove when the MSRV is raised to >= 1.87 and ctutils is updated.
    { id = "RUSTSEC-2026-0385", reason = "timing channel not reachable in passive decryption; fix needs MSRV 1.87" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 1.0

[bans]
multiple-versions = "allow"
wildcards = "deny"
# huginn-net-tcp / huginn-net-http depend on huginn-net-db as a
# version-less path dev-dependency (tests/benches only) to break the
# publish cycle with huginn-net-db (which has a real, versioned
# dependency on both). Cargo strips version-less dev-dependencies from
# the published manifest; this just tells cargo-deny not to flag them
# as wildcards.
allow-wildcard-paths = true

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
